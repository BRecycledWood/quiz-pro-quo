services:
  - type: web
    name: quiz-pro-quo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://qproquo.howstud.io
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-pro-quo-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ZOHO_EMAIL
        sync: false
      - key: ZOHO_PASSWORD
        sync: false

databases:
  - name: quiz-pro-quo-db
    databaseName: quiz_pro_quo
    user: quiz_pro_quo
    plan: free
    ipAllowList: []
