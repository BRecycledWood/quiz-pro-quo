# Permanent, isolated Render staging for Builder Studio.
# Choose this custom Blueprint path; do not apply the production render.yaml.
services:
  - type: web
    name: quiz-pro-quo-builder-staging
    runtime: node
    plan: 0.5c-512mb # Smallest always-on web plan; currently $7/month.
    region: virginia
    branch: arena/686d76f2-quiz-pro-quo
    autoDeployTrigger: checksPass
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAGING_ENV
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: quiz-pro-quo-builder-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-pro-quo-builder-staging-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: DISABLE_EXTERNAL_SIDE_EFFECTS
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      # Hard-off switch plus blank values: no Stripe calls, webhooks, or SMTP.
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: EMAIL_FROM
        value: ""
      - key: LEAD_NOTIFICATION_EMAIL
        value: ""

databases:
  - name: quiz-pro-quo-builder-staging-db
    databaseName: quiz_pro_quo_staging
    user: quiz_pro_quo_staging
    postgresMajorVersion: "16"
    plan: 0.1c-256mb # Smallest paid Postgres plan; currently $6/month.
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    region: virginia
    ipAllowList: [] # Internal Render connections only; no public DB access.
